<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surprise MJ 🎉</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* ================================
   BACKGROUND
================================ */

body {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    background-color: #222;

    /*
      Instead of COVER, we use CONTAIN.
      This prevents the head from being cropped.
    */

    background-image: url("mj-background.jpg");

    background-size: contain;

    background-position: center top;

    background-repeat: no-repeat;

}


/* Dark overlay */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.25);

    z-index: 0;

    pointer-events: none;

}


/* ================================
   MESSAGE
================================ */

#intro {

    position: relative;

    z-index: 2;

    text-align: center;

    color: white;

    padding: 20px;

    margin-top: 30px;

    animation: popIn 0.8s ease;

}


#intro h1 {

    margin: 0;

    font-size: clamp(3rem, 9vw, 7rem);

    font-weight: 800;

    letter-spacing: -3px;

    text-shadow:

        0 5px 10px rgba(0,0,0,0.6),

        0 10px 30px rgba(0,0,0,0.5);

}


#intro p {

    font-size: clamp(1rem, 3vw, 1.4rem);

    margin: 20px 0 30px;

    text-shadow:

        0 3px 10px rgba(0,0,0,0.8);

}


/* ================================
   BUTTON
================================ */

#openButton {

    border: none;

    padding: 18px 38px;

    border-radius: 50px;

    background: #ff4f87;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:

        0 10px 30px rgba(0,0,0,0.4);

    transition: 0.2s;

}


#openButton:hover {

    transform: scale(1.08);

}


#openButton:active {

    transform: scale(0.95);

}


/* ================================
   VIDEO
================================ */

#videoPopup {

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;

    background: black;

    display: none;

    justify-content: center;

    align-items: center;

    z-index: 10;

}


#videoPopup.active {

    display: flex;

    animation: fadeIn 0.4s ease;

}


#surpriseVideo {

    width: 100vw;

    height: 100vh;

    object-fit: contain;

    background: black;

}


/* ================================
   CLOSE BUTTON
================================ */

#closeButton {

    position: absolute;

    top: 20px;

    right: 20px;

    width: 50px;

    height: 50px;

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,0.7);

    color: white;

    font-size: 30px;

    cursor: pointer;

    z-index: 20;

}


/* ================================
   CONFETTI
================================ */

#confettiCanvas {

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

    z-index: 50;

}


/* ================================
   ANIMATIONS
================================ */

@keyframes popIn {

    0% {

        opacity: 0;

        transform: scale(0.5);

    }

    70% {

        transform: scale(1.05);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}


@keyframes fadeIn {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}

</style>
</head>


<body>


<!-- CONFETTI -->

<canvas id="confettiCanvas"></canvas>


<!-- ================================
     SURPRISE MESSAGE
================================ -->

<div id="intro">

    <h1>
        🎁 Surprise MJ! 🎉
    </h1>

    <p>
        Something special is waiting for you...
    </p>

    <button id="openButton">
        Open the surprise ✨
    </button>

</div>


<!-- ================================
     VIDEO POPUP
================================ -->

<div id="videoPopup">

    <button id="closeButton">
        ×
    </button>

    <video
        id="surpriseVideo"
        controls
        playsinline
        preload="auto"
    >

        <source
            src="surprise-video.mp4"
            type="video/mp4"
        >

        Your browser does not support video.

    </video>

</div>


<script>

/* ================================
   ELEMENTS
================================ */

const intro =
    document.getElementById("intro");

const openButton =
    document.getElementById("openButton");

const videoPopup =
    document.getElementById("videoPopup");

const video =
    document.getElementById("surpriseVideo");

const closeButton =
    document.getElementById("closeButton");

const canvas =
    document.getElementById("confettiCanvas");

const ctx =
    canvas.getContext("2d");


/* ================================
   CANVAS
================================ */

function resizeCanvas() {

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ================================
   CONFETTI
================================ */

let pieces = [];

let animation;


function launchConfetti() {

    pieces = [];

    for (
        let i = 0;
        i < 350;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            7 +
            Math.random() * 14;


        pieces.push({

            x:
                window.innerWidth / 2,

            y:
                window.innerHeight / 2,

            vx:
                Math.cos(angle) * speed,

            vy:
                Math.sin(angle) * speed - 8,

            gravity:
                0.2 +
                Math.random() * 0.15,

            size:
                5 +
                Math.random() * 8,

            rotation:
                Math.random() * 6,

            rotationSpeed:
                (Math.random() - 0.5) * 0.5,

            life:
                160 +
                Math.random() * 120

        });

    }


    cancelAnimationFrame(animation);

    drawConfetti();

}


function drawConfetti() {

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );


    const colors = [

        "#ff4f87",
        "#7c5cff",
        "#00c2ff",
        "#ffd447",
        "#53d769",
        "#ff7043",
        "#ffffff"

    ];


    pieces.forEach(
        (piece, index) => {

            piece.x += piece.vx;

            piece.y += piece.vy;

            piece.vy += piece.gravity;

            piece.rotation +=
                piece.rotationSpeed;

            piece.life--;


            ctx.save();


            ctx.translate(
                piece.x,
                piece.y
            );


            ctx.rotate(
                piece.rotation
            );


            ctx.fillStyle =
                colors[
                    index %
                    colors.length
                ];


            ctx.fillRect(

                -piece.size / 2,

                -piece.size / 2,

                piece.size,

                piece.size * 0.65

            );


            ctx.restore();

        }
    );


    pieces =
        pieces.filter(
            piece =>
                piece.life > 0
        );


    if (pieces.length > 0) {

        animation =
            requestAnimationFrame(
                drawConfetti
            );

    }

}


/* ================================
   BOOM SOUND
================================ */

function boomSound() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;


    const audio =
        new AudioContext();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    const now =
        audio.currentTime;


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        100,
        now
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        30,
        now + 0.5
    );


    gain.gain.setValueAtTime(
        0.001,
        now
    );


    gain.gain.exponentialRampToValueAtTime(
        0.8,
        now + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.5
    );


    oscillator.connect(gain);

    gain.connect(
        audio.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + 0.5
    );

}


/* ================================
   OPEN SURPRISE
================================ */

async function openSurprise() {

    boomSound();

    launchConfetti();

    intro.style.display =
        "none";

    videoPopup.classList.add(
        "active"
    );

    video.load();


    try {

        await video.play();

    }

    catch (error) {

        console.log(
            "Press play if autoplay is blocked."
        );

    }


    /* Fullscreen */

    try {

        await video.requestFullscreen();

    }

    catch (error) {

        try {

            await document.documentElement
                .requestFullscreen();

        }

        catch (error) {}

    }

}


/* ================================
   CLOSE
================================ */

async function closeVideo() {

    video.pause();


    if (
        document.fullscreenElement
    ) {

        try {

            await document.exitFullscreen();

        }

        catch (error) {}

    }


    videoPopup.classList.remove(
        "active"
    );


    intro.style.display =
        "block";

}


/* ================================
   BUTTONS
================================ */

openButton.addEventListener(
    "click",
    openSurprise
);


closeButton.addEventListener(
    "click",
    closeVideo
);


/* ESC */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeVideo();

        }

    }
);

</script>

</body>
</html>
