<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Surprise MJ! 🎉</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      /* PHOTO BACKGROUND */
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.35),
          rgba(0, 0, 0, 0.35)
        ),
        url("./mj-background.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* =========================
       SURPRISE MESSAGE
    ========================= */

    #intro {
      text-align: center;
      color: white;
      padding: 25px;
      animation: pop 0.8s ease;
      z-index: 2;
    }

    #intro h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 7rem);
      text-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    #intro p {
      font-size: 1.2rem;
      margin: 20px 0 30px;
      text-shadow: 0 3px 15px rgba(0,0,0,0.7);
    }

    #openButton {
      border: none;
      padding: 18px 35px;
      border-radius: 50px;

      background: #ff4f87;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.35);

      transition: 0.2s;
    }

    #openButton:hover {
      transform: scale(1.08);
    }

    #openButton:active {
      transform: scale(0.95);
    }


    /* =========================
       VIDEO POPUP
    ========================= */

    #videoPopup {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      background: black;

      display: none;

      z-index: 10;
    }

    #videoPopup.active {
      display: flex;

      justify-content: center;
      align-items: center;

      animation: fadeIn 0.4s ease;
    }


    /* FULL SCREEN VIDEO */

    #surpriseVideo {
      width: 100vw;
      height: 100vh;

      object-fit: contain;

      background: black;
    }


    /* =========================
       CLOSE BUTTON
    ========================= */

    #closeButton {
      position: absolute;

      top: 20px;
      right: 20px;

      width: 50px;
      height: 50px;

      border: none;
      border-radius: 50%;

      background: rgba(0,0,0,0.65);
      color: white;

      font-size: 30px;

      cursor: pointer;

      z-index: 20;
    }


    /* =========================
       CONFETTI
    ========================= */

    #confettiCanvas {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 50;
    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes pop {

      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }

    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }

  </style>
</head>


<body>

  <!-- CONFETTI CANVAS -->
  <canvas id="confettiCanvas"></canvas>


  <!-- =========================
       FIRST SCREEN
  ========================= -->

  <div id="intro">

    <h1>
      🎁 Surprise MJ! 🎉
    </h1>

    <p>
      Something special is waiting for you...
    </p>

    <button id="openButton">
      Open the surprise ✨
    </button>

  </div>


  <!-- =========================
       VIDEO
  ========================= -->

  <div id="videoPopup">

    <button id="closeButton">
      ×
    </button>

    <video
      id="surpriseVideo"
      controls
      playsinline
      preload="auto"
    >

      <source
        src="./surprise-video.mp4"
        type="video/mp4"
      >

      Your browser does not support video playback.

    </video>

  </div>


<script>

/* =========================
   ELEMENTS
========================= */

const intro =
  document.getElementById("intro");

const openButton =
  document.getElementById("openButton");

const videoPopup =
  document.getElementById("videoPopup");

const video =
  document.getElementById("surpriseVideo");

const closeButton =
  document.getElementById("closeButton");

const canvas =
  document.getElementById("confettiCanvas");

const ctx =
  canvas.getContext("2d");


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

  canvas.width =
    window.innerWidth *
    window.devicePixelRatio;

  canvas.height =
    window.innerHeight *
    window.devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    window.devicePixelRatio,
    0,
    0,
    window.devicePixelRatio,
    0,
    0
  );
}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   CONFETTI
========================= */

let pieces = [];
let animation;


function launchConfetti() {

  pieces = [];

  for (let i = 0; i < 350; i++) {

    const angle =
      Math.random() *
      Math.PI *
      2;

    const speed =
      6 +
      Math.random() * 15;

    pieces.push({

      x:
        window.innerWidth / 2,

      y:
        window.innerHeight / 2,

      vx:
        Math.cos(angle) * speed,

      vy:
        Math.sin(angle) * speed - 8,

      gravity:
        0.2 +
        Math.random() * 0.15,

      size:
        5 +
        Math.random() * 8,

      rotation:
        Math.random() * 6,

      rotationSpeed:
        (Math.random() - 0.5) * 0.5,

      life:
        160 +
        Math.random() * 120

    });

  }

  cancelAnimationFrame(animation);

  drawConfetti();
}


function drawConfetti() {

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );

  const colors = [
    "#ff4f87",
    "#7c5cff",
    "#00c2ff",
    "#ffd447",
    "#53d769",
    "#ff7043",
    "#ffffff"
  ];


  pieces.forEach(
    (piece, index) => {

      piece.x += piece.vx;

      piece.y += piece.vy;

      piece.vy += piece.gravity;

      piece.rotation +=
        piece.rotationSpeed;

      piece.life--;


      ctx.save();

      ctx.translate(
        piece.x,
        piece.y
      );

      ctx.rotate(
        piece.rotation
      );

      ctx.fillStyle =
        colors[
          index %
          colors.length
        ];


      ctx.fillRect(

        -piece.size / 2,

        -piece.size / 2,

        piece.size,

        piece.size * 0.65

      );


      ctx.restore();

    }
  );


  pieces =
    pieces.filter(
      piece =>
        piece.life > 0
    );


  if (pieces.length > 0) {

    animation =
      requestAnimationFrame(
        drawConfetti
      );

  }

}


/* =========================
   BOOM SOUND
========================= */

function boomSound() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContext) return;


  const audio =
    new AudioContext();

  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();


  const now =
    audio.currentTime;


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    100,
    now
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    30,
    now + 0.5
  );


  gain.gain.setValueAtTime(
    0.001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    0.8,
    now + 0.02
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.5
  );


  oscillator.connect(gain);

  gain.connect(
    audio.destination
  );


  oscillator.start(now);

  oscillator.stop(
    now + 0.5
  );

}


/* =========================
   OPEN SURPRISE
========================= */

async function openSurprise() {

  /* BOOM */
  boomSound();


  /* CONFETTI */
  launchConfetti();


  /* HIDE MESSAGE */
  intro.style.display =
    "none";


  /* SHOW VIDEO */
  videoPopup.classList.add(
    "active"
  );


  /* LOAD VIDEO */
  video.load();


  /*
    Try to play automatically.
  */

  try {

    await video.play();

  }

  catch (error) {

    console.log(
      "Autoplay blocked. Press the play button."
    );

  }


  /*
    Try browser fullscreen.
  */

  try {

    if (
      document.documentElement
        .requestFullscreen
    ) {

      await document.documentElement
        .requestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "Fullscreen unavailable."
    );

  }

}


/* =========================
   CLOSE
========================= */

async function closeVideo() {

  video.pause();


  if (
    document.fullscreenElement
  ) {

    try {

      await document.exitFullscreen();

    }

    catch (error) {}

  }


  videoPopup.classList.remove(
    "active"
  );


  intro.style.display =
    "block";

}


/* =========================
   BUTTONS
========================= */

openButton.addEventListener(
  "click",
  openSurprise
);


closeButton.addEventListener(
  "click",
  closeVideo
);


/* ESC KEY */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeVideo();

    }

  }
);


/* VIDEO ERROR */

video.addEventListener(
  "error",
  () => {

    console.error(
      "Video failed to load. Check that the filename is exactly surprise-video.mp4"
    );

  }
);

</script>

</body>
</html>
