<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Surprise MJ! 🎉</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================
       MAIN BACKGROUND
    ===================================== */

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;

      background-image: url("mj-background.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;

      background-color: #777;
    }

    /* Dark overlay */
    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.30);

      z-index: 0;

      pointer-events: none;
    }


    /* =====================================
       SURPRISE MESSAGE
    ===================================== */

    #intro {
      position: relative;
      z-index: 2;

      text-align: center;

      color: white;

      padding: 30px;

      animation: popIn 0.8s ease;
    }

    #intro h1 {
      margin: 0;

      font-size: clamp(3rem, 10vw, 7rem);

      font-weight: 800;

      letter-spacing: -4px;

      text-shadow:
        0 5px 10px rgba(0,0,0,0.5),
        0 10px 30px rgba(0,0,0,0.4);
    }

    #intro p {
      margin: 25px 0 30px;

      font-size: clamp(1rem, 3vw, 1.4rem);

      font-weight: 500;

      text-shadow:
        0 3px 10px rgba(0,0,0,0.8);
    }


    /* =====================================
       BUTTON
    ===================================== */

    #openButton {
      border: none;

      padding: 18px 35px;

      border-radius: 999px;

      background: #ff4f87;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.35);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    #openButton:hover {
      transform: scale(1.08);

      box-shadow:
        0 15px 40px rgba(0,0,0,0.45);
    }

    #openButton:active {
      transform: scale(0.95);
    }


    /* =====================================
       VIDEO POPUP
    ===================================== */

    #videoPopup {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background: #000;

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 10;
    }

    #videoPopup.active {
      display: flex;

      animation: fadeIn 0.4s ease;
    }


    /* =====================================
       VIDEO
    ===================================== */

    #surpriseVideo {
      display: block;

      width: 100vw;
      height: 100vh;

      object-fit: contain;

      background: #000;
    }


    /* =====================================
       CLOSE BUTTON
    ===================================== */

    #closeButton {
      position: absolute;

      top: 20px;
      right: 20px;

      width: 50px;
      height: 50px;

      border: none;

      border-radius: 50%;

      background: rgba(0,0,0,0.65);

      color: white;

      font-size: 30px;

      line-height: 50px;

      cursor: pointer;

      z-index: 20;

      transition: 0.2s;
    }

    #closeButton:hover {
      background: rgba(255,255,255,0.25);

      transform: scale(1.1);
    }


    /* =====================================
       CONFETTI
    ===================================== */

    #confettiCanvas {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 50;
    }


    /* =====================================
       ANIMATIONS
    ===================================== */

    @keyframes popIn {

      0% {
        opacity: 0;

        transform:
          scale(0.5);
      }

      70% {
        transform:
          scale(1.05);
      }

      100% {
        opacity: 1;

        transform:
          scale(1);
      }

    }


    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================
       CONFETTI
  ===================================== -->

  <canvas id="confettiCanvas"></canvas>


  <!-- =====================================
       SURPRISE MESSAGE
  ===================================== -->

  <div id="intro">

    <h1>
      🎁 Surprise MJ! 🎉
    </h1>

    <p>
      Something special is waiting for you...
    </p>

    <button id="openButton">
      Open the surprise ✨
    </button>

  </div>


  <!-- =====================================
       VIDEO POPUP
  ===================================== -->

  <div id="videoPopup">

    <button id="closeButton">
      ×
    </button>


    <video
      id="surpriseVideo"
      controls
      playsinline
      preload="auto"
    >

      <source
        src="surprise-video.mp4"
        type="video/mp4"
      >

      Your browser does not support MP4 video.

    </video>

  </div>


<script>

/* ==========================================
   GET ELEMENTS
========================================== */

const intro =
  document.getElementById("intro");

const openButton =
  document.getElementById("openButton");

const videoPopup =
  document.getElementById("videoPopup");

const video =
  document.getElementById("surpriseVideo");

const closeButton =
  document.getElementById("closeButton");

const canvas =
  document.getElementById("confettiCanvas");

const ctx =
  canvas.getContext("2d");


/* ==========================================
   CANVAS SIZE
========================================== */

function resizeCanvas() {

  canvas.width =
    window.innerWidth *
    window.devicePixelRatio;

  canvas.height =
    window.innerHeight *
    window.devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    window.devicePixelRatio,
    0,
    0,
    window.devicePixelRatio,
    0,
    0
  );
}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* ==========================================
   CONFETTI
========================================== */

let confetti = [];

let confettiAnimation;


function launchConfetti() {

  confetti = [];

  const amount = 350;


  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const angle =
      Math.random() *
      Math.PI *
      2;

    const speed =
      7 +
      Math.random() * 14;


    confetti.push({

      x:
        window.innerWidth / 2,

      y:
        window.innerHeight / 2,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed -
        8,

      gravity:
        0.18 +
        Math.random() * 0.15,

      size:
        5 +
        Math.random() * 8,

      rotation:
        Math.random() * 6,

      rotationSpeed:
        (Math.random() - 0.5) *
        0.5,

      life:
        150 +
        Math.random() * 120

    });

  }


  cancelAnimationFrame(
    confettiAnimation
  );


  drawConfetti();
}


function drawConfetti() {

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  const colors = [

    "#ff4f87",
    "#7c5cff",
    "#00c2ff",
    "#ffd447",
    "#53d769",
    "#ff7043",
    "#ffffff"

  ];


  confetti.forEach(
    (piece, index) => {

      piece.x += piece.vx;

      piece.y += piece.vy;

      piece.vy += piece.gravity;

      piece.rotation +=
        piece.rotationSpeed;

      piece.life--;


      ctx.save();


      ctx.translate(
        piece.x,
        piece.y
      );


      ctx.rotate(
        piece.rotation
      );


      ctx.fillStyle =
        colors[
          index %
          colors.length
        ];


      ctx.fillRect(

        -piece.size / 2,

        -piece.size / 2,

        piece.size,

        piece.size * 0.65

      );


      ctx.restore();

    }
  );


  confetti =
    confetti.filter(
      piece =>
        piece.life > 0 &&
        piece.y <
          window.innerHeight + 100
    );


  if (
    confetti.length > 0
  ) {

    confettiAnimation =
      requestAnimationFrame(
        drawConfetti
      );

  }

}


/* ==========================================
   BOOM SOUND
========================================== */

function playBoom() {

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContext) {
    return;
  }


  const audio =
    new AudioContext();


  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();


  const now =
    audio.currentTime;


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    100,
    now
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    30,
    now + 0.5
  );


  gain.gain.setValueAtTime(
    0.001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    0.8,
    now + 0.02
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.5
  );


  oscillator.connect(gain);

  gain.connect(
    audio.destination
  );


  oscillator.start(now);

  oscillator.stop(
    now + 0.5
  );

}


/* ==========================================
   OPEN SURPRISE
========================================== */

async function openSurprise() {

  /* Boom */

  playBoom();


  /* Confetti */

  launchConfetti();


  /* Hide first screen */

  intro.style.display =
    "none";


  /* Show video */

  videoPopup.classList.add(
    "active"
  );


  /* Reload video */

  video.load();


  /* Try autoplay */

  try {

    await video.play();

  }

  catch (error) {

    console.log(
      "Autoplay blocked. Press Play."
    );

  }


  /* Try fullscreen */

  try {

    if (
      document.documentElement
        .requestFullscreen
    ) {

      await document.documentElement
        .requestFullscreen();

    }

  }

  catch (error) {

    console.log(
      "Fullscreen unavailable."
    );

  }

}


/* ==========================================
   CLOSE VIDEO
========================================== */

async function closeVideo() {

  video.pause();


  if (
    document.fullscreenElement
  ) {

    try {

      await document.exitFullscreen();

    }

    catch (error) {}

  }


  videoPopup.classList.remove(
    "active"
  );


  intro.style.display =
    "block";

}


/* ==========================================
   BUTTON EVENTS
========================================== */

openButton.addEventListener(
  "click",
  openSurprise
);


closeButton.addEventListener(
  "click",
  closeVideo
);


/* ==========================================
   ESCAPE KEY
========================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeVideo();

    }

  }
);


/* ==========================================
   CHECK BACKGROUND IMAGE
========================================== */

const backgroundImage =
  new Image();

backgroundImage.src =
  "mj-background.jpg";


backgroundImage.onerror =
  function() {

    console.error(
      "BACKGROUND ERROR: mj-background.jpg was not found."
    );

  };


/* ==========================================
   CHECK VIDEO
========================================== */

video.addEventListener(
  "error",
  function() {

    console.error(
      "VIDEO ERROR: surprise-video.mp4 was not found."
    );

  }
);

</script>

</body>
</html>
